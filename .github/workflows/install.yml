name: Install gg from tap

on:
  push:
    paths:
      - Formula/gg.rb
      - .github/workflows/install.yml
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Put Linuxbrew on PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install through Homebrew
        run: brew install dawiddutoit/gg/gg
      - name: Check installed command
        run: |
          gg --version
          gg config path
          brew test dawiddutoit/gg/gg
